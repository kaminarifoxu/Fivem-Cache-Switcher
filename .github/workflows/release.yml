name: Build Windows release
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync published release notes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          foreach ($file in Get-ChildItem release-notes/v*.md) {
            $tag = $file.BaseName
            gh release view $tag *> $null
            if ($LASTEXITCODE -eq 0) {
              gh release edit $tag --notes-file $file.FullName
              if ($LASTEXITCODE -ne 0) { throw "Cannot update notes for $tag" }
            }
          }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -v
      - run: python build_windows.py
      - uses: actions/upload-artifact@v4
        with:
          name: GanoV-Cache-Switch
          path: dist/GanoV-Cache-Switch.exe
      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = python -c "from cache_switcher import VERSION; print(VERSION)"
          $tag = "v$version"
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne $tag) { throw 'Tag must match VERSION' }
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { Write-Host "Release already exists; build artifact is available."; exit 0 }
          $notes = "release-notes/$tag.md"
          if (-not (Test-Path $notes)) { throw "Create $notes before publishing this version" }
          gh release create $tag dist/GanoV-Cache-Switch.exe --target $env:GITHUB_SHA --title "GanoV-Cache-Switch $tag" --notes-file $notes
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
